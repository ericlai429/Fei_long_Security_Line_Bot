      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2 text-white font-bold text-base">

            <i class="fa-solid fa-key text-xs"></i>
          </div>
          <span id="adminModalTitle">Admin 管理員驗證</span>
        </div>
        <button type="button" onclick="closeAdminAuthModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark text-base"></i>

      </div>

        <div class="bg-gradient-to-r from-emerald-950/80 to-slate-950 border border-emerald-600/80 rounded-2xl p-3.5 space-y-1.5 shadow-md">
          <div class="flex items-center gap-2 text-emerald-300 font-extrabold text-xs">

            <span>👑 最高主管已登入 (保持登入中)</span>
          </div>
          <p class="text-[11px] text-slate-400 leading-relaxed">
            此裝置已通過密碼比對驗證，您可隨時直接進入管理後台或查看未遮蔽排班資訊。
          </p>
        </div>

        <div class="flex flex-col gap-2 pt-1">
          <a 
            href="./admin.html" 
            class="w-full h-12 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-lg active:scale-98"
          >
            <i class="fa-solid fa-sliders text-sm"></i>
            <span>進入幹部管理控制台</span>
          </a>
          <button 
            type="button" 
            onclick="showChangePinView()" 
            class="w-full h-10 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition active:scale-98"
          >
            <i class="fa-solid fa-key text-xs"></i>
            <span>修改 Master PIN 密碼</span>
          </button>
          <button 
            type="button" 
            onclick="adminLogout()"

          >
            <i class="fa-solid fa-right-from-bracket text-xs"></i>
            <span>安全登出 (清除本機密碼記憶)</span>
          </button>
        </div>
      </div>

      <!-- 🌟 面板 2：嚴格登入比對表單 (只比對密碼，絕不隨意覆寫) -->
      <form id="adminLoginForm" onsubmit="handleAdminStrictLogin(event)" class="space-y-3.5">
        <div class="flex items-center justify-between px-3 py-2 bg-slate-950/80 border border-slate-800 rounded-xl">
          <span class="text-xs font-bold text-slate-400">管理員驗證層級</span>
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
            <i class="fa-solid fa-user-shield"></i>
            <span>👑 最高權限主管</span>
          </span>
        </div>

        <div class="space-y-1">
          <label class="text-xs font-bold text-amber-400 flex items-center gap-1">
            <i class="fa-solid fa-lock"></i>
            <span>請輸入管理員 Master PIN 密碼</span>
          </label>
          <input

          >
        </div>

        <div id="adminLoginSuccess" style="display: none;" class="text-[11px] text-emerald-300 bg-emerald-950/60 p-2.5 rounded-xl border border-emerald-700 font-bold"></div>

          id="adminLoginBtn"
          class="w-full h-12 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 active:scale-[0.98] text-white font-bold rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-2"

          <span>驗證登入 (解鎖管理控制台)</span>

            想要變更密碼？點此進入修改
          </button>
        </div>
      </form>

        <div class="bg-amber-950/40 border border-amber-800/80 p-2.5 rounded-xl text-[11px] text-amber-300">
          🔒 <b>資安比對保護</b>：修改密碼前，必須先正確輸入「目前的舊密碼」以驗證身份。
        </div>

        <div class="space-y-1">
          <label class="text-xs font-bold text-rose-300 flex items-center gap-1">
            <i class="fa-solid fa-key"></i>
            <span>1. 請輸入目前舊密碼 (進行比對)</span>
          </label>
          <input 
            type="password" 
            id="adminOldPinInput" 
            autocomplete="current-password"
            placeholder="請輸入目前的舊密碼" 
            class="w-full h-10 bg-slate-950 border border-rose-800/80 rounded-xl px-3 text-xs text-center text-rose-200 tracking-widest font-mono focus:outline-none focus:border-rose-500 placeholder-slate-600"

        </div>

        <div class="space-y-1">
          <label class="text-xs font-bold text-amber-300 flex items-center gap-1">
            <i class="fa-solid fa-shield-halved"></i>
            <span>2. 請輸入新 Master PIN 密碼</span>
          </label>
          <input 
            type="password" 
            id="adminNewPinInput" 
            autocomplete="new-password"
            placeholder="請輸入欲設定之新密碼 (3~8位)" 
            class="w-full h-10 bg-slate-950 border border-amber-700/80 rounded-xl px-3 text-xs text-center text-amber-200 tracking-widest font-mono focus:outline-none focus:border-amber-500 placeholder-slate-600"
          >
        </div>

        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-300">3. 再次確認新密碼</label>
          <input 
            type="password" 
            id="adminConfirmNewPinInput" 
            autocomplete="new-password"
            placeholder="請再次輸入相同的新密碼" 
            class="w-full h-10 bg-slate-950 border border-slate-700 rounded-xl px-3 text-xs text-center text-amber-200 tracking-widest font-mono focus:outline-none focus:border-amber-500 placeholder-slate-600"
          >
        </div>

        <div id="adminChangeError" style="display: none;" class="text-[11px] text-rose-400 bg-rose-950/60 p-2 rounded-xl border border-rose-800 font-bold"></div>
        <div id="adminChangeSuccess" style="display: none;" class="text-[11px] text-emerald-300 bg-emerald-950/60 p-2 rounded-xl border border-emerald-700 font-bold"></div>

          type="submit" 
          id="adminChangeSubmitBtn"
          class="w-full h-11 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-2"

          <span>驗證舊密碼並替換為新密碼</span>

  <!-- Main Pure View (Ultra-Clean, Zero-Overflow Responsive Top Navbar) -->

      </div>
    </div>

  </main>

    飛龍保全 ｜ 三軍總醫院保全勤務

    // 🔒 嚴格登入資料比對 (打錯密碼 100% 阻擋，絕不替換密碼)
    async function handleAdminStrictLogin(e) {
      e.preventDefault();
      const pinInput = document.getElementById('adminLoginPinInput');
      const pin = pinInput ? pinInput.value.trim() : '';
      const rememberCheckbox = document.getElementById('adminRememberPinCheckbox');
      const shouldRemember = rememberCheckbox ? rememberCheckbox.checked : true;
      const errDiv = document.getElementById('adminLoginError');
      const succDiv = document.getElementById('adminLoginSuccess');

      if (errDiv) errDiv.style.display = 'none';
      if (succDiv) succDiv.style.display = 'none';

      if (!pin) {
        if (errDiv) {
          errDiv.textContent = '❌ 請輸入管理員密碼！';
          errDiv.style.display = 'block';
        }
        return;
      }

      // 🔍 進行真正的資料比對
      const savedCustomPin = localStorage.getItem('feilong_master_pin');
      let isMatch = false;

      // 1. 本機資料比對：若已有儲存的自訂密碼，必須嚴格等於儲存密碼；若無自訂密碼，比對預設密碼 789
      if (savedCustomPin) {
        isMatch = (pin === savedCustomPin);
      } else {
        isMatch = (pin === '789');
      }

      // 2. 伺服器端資料比對 (若本機比對失敗或伺服器在線)
      if (!isMatch) {
        try {
          const res = await fetch('/api/admin/master-pin/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.status === 'success') {
              isMatch = true;
            }
          }
        } catch(e) {}
      }

      // ❌ 比對失敗：密碼打錯！嚴格拒絕登入，絕對不替換密碼！
      if (!isMatch) {
        if (errDiv) {
          errDiv.textContent = '❌ 密碼比對錯誤！請確認並輸入正確的管理員 PIN 碼';
          errDiv.style.display = 'block';
        }
        if (pinInput) {
          pinInput.focus();
          pinInput.classList.add('ring-2', 'ring-rose-500');
          setTimeout(() => pinInput.classList.remove('ring-2', 'ring-rose-500'), 1500);
        }
        return;
      }

      // ✅ 比對成功：密碼完全相符！核發登入授權
      sessionMasterPin = pin;
      isUnlocked = true;
      if (shouldRemember) {
        localStorage.setItem('feilong_master_pin', pin);
        localStorage.setItem('feilong_admin_unlocked', 'true');
      }
      updateAdminKeyUi(true);

      if (succDiv) {
        succDiv.textContent = '✅ 密碼比對相符！驗證成功，管理員權限已解鎖。';
        succDiv.style.display = 'block';
      }

      setTimeout(() => {
        closeAdminAuthModal();
        fetchFullSchedule(true);
      }, 1000);
    }

    // 🔒 嚴格修改密碼：必須先 100% 正確輸入目前舊密碼，才准替換為新密碼！
    async function handleAdminChangePin(e) {
      e.preventDefault();
      const oldPinInput = document.getElementById('adminOldPinInput');
      const newPinInput = document.getElementById('adminNewPinInput');
      const confirmInput = document.getElementById('adminConfirmNewPinInput');
      const errDiv = document.getElementById('adminChangeError');
      const succDiv = document.getElementById('adminChangeSuccess');

      const oldPin = oldPinInput ? oldPinInput.value.trim() : '';
      const newPin = newPinInput ? newPinInput.value.trim() : '';
      const confirmPin = confirmInput ? confirmInput.value.trim() : '';

      if (errDiv) errDiv.style.display = 'none';
      if (succDiv) succDiv.style.display = 'none';

      // 🔍 關卡 1：舊密碼嚴格比對
      const currentRealPin = localStorage.getItem('feilong_master_pin') || '789';
      let isOldPinValid = (oldPin === currentRealPin);

      // 若前端未命中，透過後端驗證舊密碼
      if (!isOldPinValid) {
        try {
          const verifyRes = await fetch('/api/admin/master-pin/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: oldPin })
          });
          if (verifyRes.ok) isOldPinValid = true;
        } catch(e) {}
      }

      // ❌ 舊密碼比對失敗：直接阻擋！
      if (!isOldPinValid) {
        if (errDiv) {
          errDiv.textContent = '❌ 目前舊密碼輸入錯誤！資料比對失敗，拒絕修改密碼。';
          errDiv.style.display = 'block';
        }
        if (oldPinInput) {
          oldPinInput.focus();
          oldPinInput.classList.add('ring-2', 'ring-rose-500');
          setTimeout(() => oldPinInput.classList.remove('ring-2', 'ring-rose-500'), 1500);
        }
        return;
      }

      // 🔍 關卡 2：新密碼格式與一致性檢查
      if (!newPin || newPin.length < 3) {
        if (errDiv) {
          errDiv.textContent = '❌ 新密碼長度至少需 3 位數以上！';
          errDiv.style.display = 'block';
        }
        return;
      }

      if (newPin !== confirmPin) {
        if (errDiv) {
          errDiv.textContent = '❌ 兩次輸入的新密碼不一致，請重新確認！';
          errDiv.style.display = 'block';
        }
        return;
      }

      // ✅ 舊密碼已確認比對正確 ➔ 執行新密碼儲存與替換！
      localStorage.setItem('feilong_master_pin', newPin);
      localStorage.setItem('feilong_admin_unlocked', 'true');
      sessionMasterPin = newPin;
      isUnlocked = true;
      updateAdminKeyUi(true);

      // 同步後端更新 (帶舊密碼校驗)
      try {
        await fetch('/api/admin/master-pin/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_pin: oldPin, new_pin: newPin, admin_email: 'admin_session' })
        });
      } catch(e) {}

      if (succDiv) {
        succDiv.textContent = '🎉 舊密碼核對成功！新 Master PIN 碼已正式更新儲存！';
        succDiv.style.display = 'block';
      }

      setTimeout(() => {
        showUnlockedView();
        fetchFullSchedule(true);
      }, 1500);
    }

    // 🔤 人員名稱格式化：100% 水平垂直居中、固定寬高與均勻字距，徹底杜絕歪斜
    // 🔒 資安防護：前天及更早之排班，電話不浮窗顯示 (Admin 登入解鎖者無此限制)
            function formatName(nameStr, isHistorical = false, hidePhone = false) {
      if (!nameStr || nameStr === '-' || nameStr === '—') return '<span class="inline-block text-slate-600 font-bold text-sm">—</span>';
      
      const items = nameStr.split(/[、,]+/).filter(Boolean);
      return items.map(item => {
        item = item.trim();
        const phoneMatch = item.match(/09\d{2}[-\s]?\d{3}[-\s]?\d{3}|\d{9,10}/);
        const phone = phoneMatch ? phoneMatch[0] : '';
        const cleanName = item.replace(/[\(（]?09\d{2}[-\s]?\d{3}[-\s]?[0-9]{3}[\)）]?|\d{8,10}|[\(（]\d+[\)]?/g, '').trim();
        
        if (!cleanName) return item;

        // 🌟 核心：固定寬度（96px / sm: 108px）、左側統一內縮 pl-3、文字絕對向左對齊 (text-left)，確保第一字左緣一線垂直到底！
        if (isHistorical || (hidePhone && !isUnlocked)) {
          return `<div class="inline-flex relative items-center justify-start w-[96px] sm:w-[108px] h-7 sm:h-8 pl-3 pr-2 rounded-lg bg-slate-800/50 text-slate-200 text-[15px] sm:text-[16px] font-black tracking-wider text-left whitespace-nowrap shadow-sm"><span class="text-left">${cleanName}</span></div>`;
        }

        if (phone) {
          const telHref = `tel:${phone.replace(/[-\s]/g, '')}`;
          return `
            <div class="relative group inline-flex items-center justify-center whitespace-nowrap">
              <button type="button" class="inline-flex relative items-center justify-start w-[96px] sm:w-[108px] h-7 sm:h-8 pl-3 pr-2 rounded-lg bg-slate-800/95 border border-slate-700 hover:border-amber-400 hover:bg-slate-700 text-white text-[15px] sm:text-[16px] font-black tracking-wider text-left transition shadow-sm active:scale-95 whitespace-nowrap">
                <span class="text-left">${cleanName}</span>
                <i class="fa-solid fa-phone text-[8px] text-amber-400 opacity-90 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </button>
              <div class="invisible group-hover:visible group-focus-within:visible opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-all duration-200 absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-50 px-3 py-1.5 bg-slate-950 border border-amber-500 text-amber-300 text-xs font-mono rounded-xl shadow-2xl whitespace-nowrap flex items-center gap-2 pointer-events-auto">
                <i class="fa-solid fa-phone-volume text-emerald-400 animate-pulse"></i>
                <a href="${telHref}" class="font-bold underline hover:text-white">${phone}</a>
                <span class="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">(撥打)</span>
              </div>
            </div>
          `;
        }

        return `<div class="inline-flex relative items-center justify-start w-[96px] sm:w-[108px] h-7 sm:h-8 pl-3 pr-2 rounded-lg bg-slate-800/80 text-white text-[15px] sm:text-[16px] font-black tracking-wider text-left whitespace-nowrap shadow-sm"><span class="text-left">${cleanName}</span></div>`;
      }).join(' ');
    }

    // ⚡ 即時秒開排班抓取引擎
    async function fetchFullSchedule(isManualQuery = false) {
      const qBtn = document.getElementById('queryScheduleBtn');
      if (qBtn && isManualQuery) {
        qBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i><span>查詢中...</span>';
        qBtn.disabled = true;
      }
      const container = document.getElementById('scheduleContainer');

      // 🌟 1. 預設當月即時排班 (8月)：優先以內嵌快照 0.001 秒秒開！
      const isEng = (currentTabName.includes('4.') || currentTabName.includes('工務所'));
      const currentTabKey = isEng ? '4.三總工務所' : '5.三總重症大樓';

      // 🌟 1. 8月即時排班
      if (selectedYear === REAL_CURRENT_YEAR && selectedMonth === 8) {
        if (EMBEDDED_SCHEDULE_DATA_8[currentTabKey]) {

            qBtn.disabled = false;
          }
          return;
        }
      }

      // 🌟 2. 7月歷史排班 (嚴格讀取 Google 雲端真實試算表，絕不假造)
      if (selectedYear === REAL_CURRENT_YEAR && selectedMonth === 7) {
        setConnectionStatus('connecting', '讀取7月真實雲端表單...');
        // 若尚未於後台綁定 115.07 試算表 ID，直接顯示真實待綁定卡片
        container.innerHTML = `
          <div class="text-center py-12 space-y-4">
            <div class="w-14 h-14 rounded-2xl bg-sky-950/80 border border-sky-800 text-sky-400 flex items-center justify-center mx-auto text-2xl shadow-lg">

      setConnectionStatus('connecting', '雲端握手中...');

      // 🌟 2. 本地開發環境 (localhost / 127.0.0.1) 直連本地後端
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {

            <div class="text-center py-12 space-y-4">
              <div class="w-14 h-14 rounded-2xl bg-purple-950/80 border border-purple-800 text-purple-400 flex items-center justify-center mx-auto text-2xl shadow-lg">
                <i class="fa-solid fa-calendar-plus"></i>
              </div>
              <div class="space-y-1.5">
                <h3 class="text-base font-bold text-purple-300">【115.09 預排中】九月份排班表編排中</h3>
                <p class="text-xs text-slate-400 max-w-md mx-auto">
                  管理員已成功解鎖預覽！目前 Google 雲端尚未建立 115.09 試算表，一旦排班人員發布檔案，系統將自動即時同步。
                </p>
              </div>
            </div>
          `;
          return;
        }
        container.innerHTML = '<div class="text-center py-8 text-slate-500">尚無排班資料</div>';
        return;
      }

      
      let html = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-table-list text-emerald-400"></i>
            <span class="text-sm font-bold text-white">人員班表(即時雲端) <span class="text-xs text-emerald-400 font-bold">(${selectedMonth === REAL_CURRENT_MONTH ? "本月" : selectedMonth + "月"}${data.rows.length}天)</span></span>
          </div>
        </div>

        <div class="overflow-x-auto w-full">
          <table class="w-full text-left text-xs border-collapse table-fixed">
            <thead>
              <tr class="bg-slate-950 text-slate-300 border-b border-slate-800 font-bold">
                <th class="w-[17%] py-2 px-1 whitespace-nowrap text-center text-xs">日期</th>
                <th class="w-[11%] py-2 px-0.5 whitespace-nowrap text-center text-xs">週</th>
                <th class="w-[36%] py-2 px-1 whitespace-nowrap text-center text-amber-400 font-extrabold text-[13px]">☀️ 早班</th>
                <th class="w-[36%] py-2 px-1 whitespace-nowrap text-center text-sky-300 font-extrabold text-[13px]">🌆 晚班</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/90">
      `;

      const now = new Date();
      const todayShort = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
      const todayFull = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

      data.rows.forEach(r => {
        let rawDate = (r['日期'] || '-').trim();
        let dateStr = rawDate;
        if (dateStr.length > 5 && dateStr.includes('/')) {
          const parts = dateStr.split('/');
          if (parts.length === 3) dateStr = `${parts[1]}/${parts[2]}`;
        }

        const weekStr = (r['星期'] || '').trim();
        const early = r['早班 (07-19)'] || r['早班'] || '-';
        const late = r['晚班 (19-07)'] || r['晚班'] || '-';

        // 🌟 判斷是否為「今天」
        const isToday = (selectedYear === now.getFullYear() && selectedMonth === (now.getMonth() + 1)) &&
                        (dateStr === todayShort || rawDate === todayFull || rawDate.includes(todayShort));

        // 🎨 星期六/日 ＆ 今日暖色系醒目配色
        let weekBadgeClass = 'bg-slate-800/90 text-slate-300 border-slate-700';
        let rowClass = 'hover:bg-slate-800/40 border-b border-slate-800/80';
        let dateDisplayHtml = `<span class="font-mono font-extrabold text-slate-100">${dateStr}</span>`;
        let weekDisplayHtml = `<span class="px-1.5 py-0.5 rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;

        if (isToday) {
          // 🔥 今天的日期：底色 High Light 暖色系琥珀金光，日期保持與其他列完全相同的等寬版型
          rowClass = 'bg-gradient-to-r from-amber-500/25 via-amber-500/35 to-amber-500/25 border-y-2 border-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.3)] ring-1 ring-amber-400/60 font-black';
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center py-0.5 rounded-md bg-amber-500 text-slate-950 font-black text-xs sm:text-sm font-mono shadow-md">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded-md bg-amber-500 text-slate-950 font-black text-[11px] shadow-md">${weekStr}</span>`;
        } else if (weekStr === '六' || weekStr === 'Sat' || weekStr.includes('六')) {
          weekBadgeClass = 'bg-teal-950 text-teal-300 border-teal-500 font-black shadow-sm';
          rowClass = 'bg-teal-950/25 hover:bg-teal-900/40 border-b border-slate-800/80';
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center font-mono font-extrabold text-teal-200">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;
        } else if (weekStr === '日' || weekStr === 'Sun' || weekStr.includes('日')) {
          weekBadgeClass = 'bg-rose-950 text-rose-300 border-rose-500 font-black shadow-sm';
          rowClass = 'bg-rose-950/25 hover:bg-rose-900/40 border-b border-slate-800/80';
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center font-mono font-extrabold text-rose-200">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;
        } else {
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center font-mono font-extrabold text-slate-100">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;
        }

        const isHistorical = !(selectedYear === REAL_CURRENT_YEAR && selectedMonth === REAL_CURRENT_MONTH);

        // 🔒 前天與更早之排班判定 (今天 = now.getDate(), 昨天 = now.getDate() - 1, 前天 = now.getDate() - 2)
        let rowDayNum = 0;
        if (dateStr.includes('/')) {
          const parts = dateStr.split('/');
          rowDayNum = parseInt(parts[parts.length - 1], 10) || 0;
        }
        // 若當前月份且日期 <= 今天 - 2 (前天或更早)，啟動電話隱藏保護
        const isBeforeYesterday = (selectedYear === now.getFullYear() && selectedMonth === (now.getMonth() + 1)) && (rowDayNum > 0 && rowDayNum <= (now.getDate() - 2));

        html += `
          <tr class="${rowClass} transition">
            <td class="w-[17%] py-2.5 px-1 whitespace-nowrap text-center text-xs sm:text-sm">${dateDisplayHtml}</td>
            <td class="w-[11%] py-2.5 px-0.5 whitespace-nowrap text-center">${weekDisplayHtml}</td>
            <td class="w-[36%] py-1.5 px-0.5 whitespace-nowrap text-center align-middle font-medium">${formatName(early, isHistorical, isBeforeYesterday)}</td>
            <td class="w-[36%] py-1.5 px-0.5 whitespace-nowrap text-center align-middle font-medium">${formatName(late, isHistorical, isBeforeYesterday)}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }



    document.addEventListener('DOMContentLoaded', () => {
      restoreAdminSession();
      updateMonthDisplay();
      fetchFullSchedule();
    });
  </script>
</body>
</html>
