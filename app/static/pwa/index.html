<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>飛龍保全 ｜ 三總勤務排班即時系統 (多版型自適應)</title>
  <link rel="manifest" href="/static/pwa/manifest.json">
  <meta name="theme-color" content="#090d16">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Table for PC & Mobile Landscape */
    .matrix-table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased select-none pb-12">

  <!-- Top Sticky Navigation Bar -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-3 sm:px-6 py-3 shadow-xl">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <!-- Title & Branding -->
      <div class="flex items-center space-x-2.5 sm:space-x-3">
        <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-sky-600 flex items-center justify-center shadow-lg shadow-purple-600/30 flex-shrink-0">
          <i class="fa-solid fa-shield-halved text-white text-xl sm:text-2xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white leading-tight">飛龍保全 ｜ 三總勤務</h1>
            <span class="text-[10px] bg-purple-950 text-purple-300 px-1.5 py-0.5 rounded border border-purple-800 font-bold hidden sm:inline-block">多端自適應</span>
          </div>
          <p class="text-xs text-sky-400 font-semibold flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="currentTabName">三總保全內部群</span>
          </p>
        </div>
      </div>
      
      <!-- Right Controls: Auth & Reload -->
      <div class="flex items-center gap-2">
        <button id="authBtn" onclick="openAuthModal()" class="h-10 sm:h-11 px-3 sm:px-4 bg-slate-800 active:bg-slate-700 hover:bg-slate-700 text-purple-300 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 border border-slate-700 transition shadow-sm">
          <i class="fa-solid fa-key text-xs sm:text-sm"></i>
          <span id="authStatusText">雙PIN驗證</span>
        </button>
        <button id="refreshBtn" onclick="fetchLiveSchedule()" class="w-10 h-10 sm:w-11 sm:h-11 bg-slate-800 active:bg-slate-700 hover:bg-slate-700 text-sky-400 rounded-xl text-base flex items-center justify-center border border-slate-700 transition shadow-sm" title="重新整理">
          <i class="fa-solid fa-rotate" id="refreshIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Big Intuitive PIN Unlock Modal -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <div class="text-center space-y-1.5">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white mx-auto flex items-center justify-center text-2xl font-bold shadow-lg shadow-purple-600/30">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="text-lg font-bold text-white">飛龍保全 班表安全解鎖</h3>
        <p class="text-xs text-slate-400">請輸入「主 PIN 碼 (789)」與「小隊 輔 PIN 碼」</p>
      </div>

      <form id="pinAuthForm" onsubmit="handlePinUnlock(event)" class="space-y-3">
        <!-- Master PIN -->
        <div>
          <label class="block text-slate-300 text-xs font-bold mb-1 flex items-center justify-between">
            <span>飛龍保全 主 PIN 碼</span>
            <span class="text-xs text-purple-400 font-mono font-bold bg-purple-950 px-2 py-0.5 rounded border border-purple-800">預設 789</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-shield absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input 
              type="text" 
              id="inputMasterPin" 
              value="789" 
              inputmode="numeric"
              required 
              placeholder="請輸入主 PIN 碼" 
              class="w-full h-12 bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3 py-2.5 text-base font-mono tracking-widest text-white text-center font-bold placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500 transition shadow-inner"
            >
          </div>
        </div>

        <!-- Sub PIN -->
        <div>
          <label class="block text-slate-300 text-xs font-bold mb-1 flex items-center justify-between">
            <span>小隊 輔 PIN 碼 (3~4位數)</span>
            <span class="text-xs text-sky-400">排班小姐自訂</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input 
              type="password" 
              id="inputSubPin" 
              inputmode="numeric"
              maxlength="4"
              required 
              placeholder="請輸入小隊 3~4 碼輔密碼" 
              class="w-full h-12 bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3 py-2.5 text-base font-mono tracking-widest text-white text-center font-bold placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500 transition shadow-inner"
            >
          </div>
        </div>

        <div id="authErrorMsg" class="hidden text-xs text-rose-300 bg-rose-950/70 p-2.5 rounded-xl border border-rose-800 text-center font-bold"></div>

        <button 
          type="submit" 
          class="w-full h-13 bg-gradient-to-r from-purple-600 to-sky-600 active:scale-[0.98] text-white font-bold rounded-xl text-base transition shadow-xl shadow-purple-600/30 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-lock-open"></i>
          <span>驗證並解鎖查班</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main Container (Adaptive to Mobile Portrait, Mobile Landscape, and PC Desktop) -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-5 space-y-4">
    
    <!-- 🎛️ Layout Selector Bar (3大版型切換控制列) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 sm:p-3 shadow-md flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-300">
        <i class="fa-solid fa-table-cells-large text-sky-400"></i>
        <span>切換可視版型：</span>
      </div>

      <!-- 3 Layout Toggle Buttons -->
      <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs sm:text-sm font-bold overflow-x-auto no-scrollbar">
        <!-- Layout A: Card View -->
        <button 
          id="btnLayoutCard" 
          onclick="setLayoutMode('CARD')" 
          class="layout-tab-btn active bg-sky-600 text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm flex-shrink-0"
        >
          <i class="fa-solid fa-grip-vertical"></i>
          <span>🎴 哨點大卡片 (手機直式首選)</span>
        </button>

        <!-- Layout B: Matrix Grid Table -->
        <button 
          id="btnLayoutMatrix" 
          onclick="setLayoutMode('MATRIX')" 
          class="layout-tab-btn bg-slate-900 text-slate-400 hover:text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 flex-shrink-0"
        >
          <i class="fa-solid fa-table"></i>
          <span>📊 總覽大表格 (PC / 橫式首選)</span>
        </button>

        <!-- Layout C: Member Timeline -->
        <button 
          id="btnLayoutTimeline" 
          onclick="setLayoutMode('TIMELINE')" 
          class="layout-tab-btn bg-slate-900 text-slate-400 hover:text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 flex-shrink-0"
        >
          <i class="fa-solid fa-user-clock"></i>
          <span>👤 個人勤務時間線</span>
        </button>
      </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
      <!-- Search Box (7 cols) -->
      <div class="md:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-2.5 shadow-md flex items-center">
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜尋同仁姓名 (如：陳冠冠) 或 哨點名稱..." 
            class="w-full h-11 bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-9 py-2 text-sm sm:text-base text-white placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500 transition"
            oninput="filterSchedule()"
          >
          <button id="clearSearch" onclick="clearSearchInput()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Shift Filter Buttons (5 cols) : 僅分早班與晚班 -->
      <div class="md:col-span-5 grid grid-cols-3 gap-2">
        <button onclick="setShiftFilter('ALL')" class="shift-btn active h-11 bg-sky-600 text-white rounded-xl font-bold text-xs sm:text-sm transition shadow-sm flex items-center justify-center" data-shift="ALL">
          全部
        </button>
        <button onclick="setShiftFilter('早班')" class="shift-btn h-11 bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center" data-shift="早班">
          ☀️ 早班
        </button>
        <button onclick="setShiftFilter('晚班')" class="shift-btn h-11 bg-slate-800 border border-slate-600 text-slate-200 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center" data-shift="晚班">
          🌆 晚班
        </button>
      </div>
    </div>

    <!-- Quick Member One-Click Tap Badges (按鈕化快速點選同仁姓名) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2 shadow-md">
      <div class="flex items-center justify-between text-xs font-bold text-slate-400">
        <span class="flex items-center gap-1.5 text-slate-300">
          <i class="fa-solid fa-user-check text-sky-400"></i>
          <span>快速點選同仁 (免打字查班)：</span>
        </span>
        <button onclick="clearSearchInput()" class="text-sky-400 hover:underline">清除篩選</button>
      </div>
      <div id="membersButtonsContainer" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5">
        <span class="text-xs text-slate-500 py-1">解鎖後自動載入同仁名單...</span>
      </div>
    </div>

    <!-- Quick PDF Export Bar -->
    <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800 px-4 py-2.5 rounded-2xl">
      <div class="text-xs text-slate-400 flex items-center gap-2">
        <i class="fa-solid fa-lock text-purple-400"></i>
        <span>高資安架構 ｜ 雲端即時直連 ｜ 手機零暫存</span>
      </div>
      <button onclick="downloadCurrentPdf()" id="downloadPdfBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 border border-slate-700 transition">
        <i class="fa-solid fa-file-pdf text-rose-400"></i>
        <span>匯出 PDF 班表</span>
      </button>
    </div>

    <!-- Dynamic Schedule Container (Switches between Card, Matrix Table, Timeline) -->
    <div id="scheduleContainer" class="min-h-[300px]">
      <div class="text-center py-20 text-slate-400 text-sm flex flex-col items-center gap-3 bg-slate-900/50 rounded-2xl border border-slate-800">
        <div class="w-10 h-10 border-3 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-base font-bold">請輸入雙 PIN 碼以解鎖雲端班表...</span>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800 mt-auto">
    飛龍保全 ｜ 三軍總醫院勤務排班系統 ｜ 支援 PC、手機直式與橫式自適應
  </footer>

  <script>
    let rawScheduleData = null;
    let currentShiftFilter = 'ALL';
    let currentLayoutMode = 'CARD'; // 'CARD' | 'MATRIX' | 'TIMELINE'
    let sessionMasterPin = '789';
    let sessionSubPin = '';
    let isUnlocked = false;

    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('group_id') || 'tsgh_internal';
    const tabName = urlParams.get('tab') || '三總保全內部群';

    document.getElementById('currentTabName').textContent = tabName;

    // Detect device screen orientation / size for default layout recommendation
    if (window.innerWidth >= 1024 || (window.innerWidth > window.innerHeight && window.innerWidth >= 768)) {
      // Large PC screen or large tablet in landscape -> default to MATRIX
      currentLayoutMode = 'CARD'; 
    }

    function setLayoutMode(mode) {
      currentLayoutMode = mode;
      
      const btnCard = document.getElementById('btnLayoutCard');
      const btnMatrix = document.getElementById('btnLayoutMatrix');
      const btnTimeline = document.getElementById('btnLayoutTimeline');

      const activeClass = "layout-tab-btn active bg-sky-600 text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm flex-shrink-0";
      const inactiveClass = "layout-tab-btn bg-slate-900 text-slate-400 hover:text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 flex-shrink-0";

      btnCard.className = mode === 'CARD' ? activeClass : inactiveClass;
      btnMatrix.className = mode === 'MATRIX' ? activeClass : inactiveClass;
      btnTimeline.className = mode === 'TIMELINE' ? activeClass : inactiveClass;

      if (rawScheduleData && rawScheduleData.rows) {
        filterSchedule();
      }
    }

    function openAuthModal() {
      document.getElementById('authModal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    async function handlePinUnlock(e) {
      e.preventDefault();
      const masterPin = document.getElementById('inputMasterPin').value.trim();
      const subPin = document.getElementById('inputSubPin').value.trim();
      const errorDiv = document.getElementById('authErrorMsg');

      errorDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/verify-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            group_id: groupId,
            master_pin: masterPin,
            sub_pin: subPin
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.detail || 'PIN 碼驗證失敗');
        }

        sessionMasterPin = masterPin;
        sessionSubPin = subPin;
        isUnlocked = true;
        
        document.getElementById('authStatusText').textContent = '已解鎖';
        document.getElementById('authBtn').className = "h-10 sm:h-11 px-3 sm:px-4 bg-emerald-950 text-emerald-400 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 border border-emerald-700 transition shadow-sm";

        closeAuthModal();
        fetchLiveSchedule();
      } catch (err) {
        errorDiv.textContent = '❌ ' + err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    async function fetchLiveSchedule() {
      if (!isUnlocked) {
        openAuthModal();
        return;
      }

      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('animate-spin');
      
      const container = document.getElementById('scheduleContainer');
      
      try {
        const timestamp = new Date().getTime();
        const res = await fetch(`/api/schedule/live?group_id=${encodeURIComponent(groupId)}&tab=${encodeURIComponent(tabName)}&master_pin=${encodeURIComponent(sessionMasterPin)}&sub_pin=${encodeURIComponent(sessionSubPin)}&t=${timestamp}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache'
          }
        });

        if (!res.ok) {
          if (res.status === 401) {
            isUnlocked = false;
            openAuthModal();
            throw new Error('PIN 碼已變更，請重新輸入新密碼！');
          }
          throw new Error('伺服器連線失敗');
        }

        const data = await res.json();
        rawScheduleData = data;

        document.getElementById('currentTabName').textContent = data.tab_name || tabName;
        
        renderMemberBadges(data.members || []);
        filterSchedule();
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="bg-rose-950/70 border border-rose-800 rounded-3xl p-8 text-center space-y-3">
            <i class="fa-solid fa-triangle-exclamation text-rose-400 text-3xl"></i>
            <p class="text-rose-200 text-base font-bold">無法取得排班資料</p>
            <p class="text-sm text-rose-300">${err.message}</p>
            <button onclick="openAuthModal()" class="h-12 bg-purple-700 active:bg-purple-600 text-white text-sm px-6 rounded-xl font-bold">重新驗證雙 PIN 碼</button>
          </div>
        `;
      } finally {
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 400);
      }
    }

    // 🎨 淡色系底色色票 (Pastel color palette for distinct member names)
    const PASTEL_NAME_PALETTES = [
      { bg: 'bg-sky-950/60', text: 'text-sky-200', border: 'border-sky-700/60' },
      { bg: 'bg-emerald-950/60', text: 'text-emerald-200', border: 'border-emerald-700/60' },
      { bg: 'bg-purple-950/60', text: 'text-purple-200', border: 'border-purple-700/60' },
      { bg: 'bg-amber-950/60', text: 'text-amber-200', border: 'border-amber-700/60' },
      { bg: 'bg-rose-950/60', text: 'text-rose-200', border: 'border-rose-700/60' },
      { bg: 'bg-indigo-950/60', text: 'text-indigo-200', border: 'border-indigo-700/60' },
      { bg: 'bg-teal-950/60', text: 'text-teal-200', border: 'border-teal-700/60' },
      { bg: 'bg-cyan-950/60', text: 'text-cyan-200', border: 'border-cyan-700/60' }
    ];

    function getPastelPalette(name) {
      if (!name || name === '-') return { bg: 'bg-slate-950/40', text: 'text-slate-400', border: 'border-slate-800' };
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const idx = Math.abs(hash) % PASTEL_NAME_PALETTES.length;
      return PASTEL_NAME_PALETTES[idx];
    }

    // 🌟 姓名的「姓」加大 1.2 倍粗體顯示
    function formatNameWithEnlargedSurname(name) {
      if (!name || name === '-') return '-';
      const trimmed = name.trim();
      if (trimmed.length <= 1) {
        return `<span class="text-[1.2em] font-extrabold tracking-tight">${trimmed}</span>`;
      }
      const surname = trimmed.charAt(0);
      const givenName = trimmed.slice(1);
      return `<span class="text-[1.2em] font-extrabold tracking-tight">${surname}</span><span class="font-semibold">${givenName}</span>`;
    }

    // 🏷️ 格式化同仁標籤 (包含淡色系底色與姓加大1.2倍)
    function renderMemberPill(name, customClass = '') {
      if (!name || name === '-') return '<span class="text-slate-500 font-mono">-</span>';
      const palette = getPastelPalette(name);
      return `
        <span class="inline-flex items-center px-2 py-0.5 rounded-lg border text-xs sm:text-sm ${palette.bg} ${palette.text} ${palette.border} ${customClass}">
          ${formatNameWithEnlargedSurname(name)}
        </span>
      `;
    }

    function renderMemberBadges(members) {
      const container = document.getElementById('membersButtonsContainer');
      if (!members || members.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-500 py-1">無同仁清單</span>`;
        return;
      }

      let html = '';
      members.forEach(name => {
        const palette = getPastelPalette(name);
        html += `
          <button 
            onclick="selectMemberSearch('${name}')" 
            class="member-btn flex-shrink-0 ${palette.bg} ${palette.text} ${palette.border} hover:opacity-90 active:scale-95 px-3 py-1.5 rounded-xl text-xs font-bold border transition shadow-sm"
          >
            👤 ${formatNameWithEnlargedSurname(name)}
          </button>
        `;
      });
      container.innerHTML = html;
    }

    function selectMemberSearch(name) {
      const input = document.getElementById('searchInput');
      input.value = name;
      document.getElementById('clearSearch').classList.remove('hidden');
      filterSchedule();
    }

    function setShiftFilter(shift) {
      currentShiftFilter = shift;
      document.querySelectorAll('.shift-btn').forEach(btn => {
        if (btn.dataset.shift === shift) {
          btn.className = "shift-btn active h-11 bg-sky-600 text-white rounded-xl font-bold text-xs sm:text-sm transition shadow-sm flex items-center justify-center";
        } else {
          btn.className = "shift-btn h-11 bg-slate-900 border border-slate-800 text-slate-300 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center";
        }
      });
      filterSchedule();
    }

    function clearSearchInput() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearch').classList.add('hidden');
      filterSchedule();
    }

    // 🔤 生僻字與異體字雙向模糊相容字典 (Rare & Variant Chinese Character Fuzzy Map)
    const RARE_VARIANT_PAIRS = {
      '堃': '坤', '坤': '堃', '煊': '宣', '宣': '煊', '珉': '民', '民': '珉',
      '喆': '吉', '吉': '喆', '彣': '文', '文': '彣', '澔': '浩', '浩': '澔',
      '蒨': '倩', '倩': '蒨', '霈': '沛', '沛': '霈', '璘': '麟', '麟': '璘',
      '昇': '升', '升': '昇', '峯': '峰', '峰': '峯', '恒': '恆', '恆': '恒',
      '詠': '泳', '泳': '詠', '羣': '群', '群': '羣', '頴': '穎', '穎': '頴',
      '温': '溫', '溫': '温', '黄': '黃', '黃': '黄', '眞': '真', '真': '眞',
      '杰': '傑', '傑': '杰', '甯': '寧', '寧': '甯', '玥': '月', '月': '玥'
    };

    function getSearchVariants(q) {
      if (!q) return [];
      const set = new Set([q]);
      for (let i = 0; i < q.length; i++) {
        const ch = q[i];
        if (RARE_VARIANT_PAIRS[ch]) {
          const alt = RARE_VARIANT_PAIRS[ch];
          set.add(q.slice(0, i) + alt + q.slice(i + 1));
        }
      }
      return Array.from(set);
    }

    function filterSchedule() {
      if (!rawScheduleData || !rawScheduleData.rows) return;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearch');
      
      if (query) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      const queryVariants = getSearchVariants(query);

      const filteredRows = rawScheduleData.rows.filter(row => {
        let matchQuery = true;
        if (query) {
          matchQuery = Object.values(row).some(val => {
            const strVal = String(val).toLowerCase();
            return queryVariants.some(v => strVal.includes(v));
          });
        }

        let matchShift = true;
        if (currentShiftFilter !== 'ALL') {
          const early = row['早班 (07-19)'] || row['早班'] || '';
          const late = row['晚班 (19-07)'] || row['晚班'] || '';
          
          if (currentShiftFilter === '早班' && !early) matchShift = false;
          if (currentShiftFilter === '晚班' && !late) matchShift = false;
        }

        return matchQuery && matchShift;
      });

      // Dispatch to chosen layout render engine
      if (currentLayoutMode === 'CARD') {
        renderCardLayout(filteredRows, rawScheduleData.columns);
      } else if (currentLayoutMode === 'MATRIX') {
        renderMatrixLayout(filteredRows, rawScheduleData.columns);
      } else if (currentLayoutMode === 'TIMELINE') {
        renderTimelineLayout(filteredRows, query);
      }
    }

    /* 🎴 版型 A: 哨點大卡片模式 (手機直式最佳，早/晚雙班制) */
    function renderCardLayout(rows, columns) {
      const container = document.getElementById('scheduleContainer');
      if (!rows || rows.length === 0) {
        renderEmptyState(container);
        return;
      }

      let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">';
      rows.forEach(r => {
        const dateStr = r['日期'] || '未指定日期';
        const weekStr = r['星期'] || '';
        const postStr = r['哨點/崗位'] || r['哨點'] || r['崗位'] || '一般哨點';
        const noteStr = r['備註'] || '';

        const early = r['早班 (07-19)'] || r['早班'] || '-';
        const late = r['晚班 (19-07)'] || r['晚班'] || '-';
        const support = r['機動支援'] || r['機動'] || '-';

        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md space-y-3 transition hover:border-purple-500">
            <!-- Header -->
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
              <div class="flex items-center gap-2">
                <span class="text-base sm:text-lg font-bold text-white font-mono">${dateStr}</span>
                <span class="text-xs bg-sky-950 text-sky-300 px-2.5 py-0.5 rounded-lg font-bold border border-sky-800">${weekStr}</span>
              </div>
              <span class="text-xs sm:text-sm font-bold text-amber-300 bg-amber-950/80 border border-amber-800 px-3 py-0.5 rounded-full">
                <i class="fa-solid fa-location-dot mr-1"></i>${postStr}
              </span>
            </div>

            <!-- Badges: 僅分 ☀️ 早班 (亮暖色系) vs 🌆 晚班 (淺灰色系) -->
            <div class="grid grid-cols-2 gap-2.5 text-center">
              <!-- ☀️ 早班 (亮暖色系) -->
              <div class="bg-amber-500/15 border border-amber-500/40 rounded-xl p-3 shadow-sm">
                <div class="text-xs text-amber-300 font-bold mb-1.5 flex items-center justify-center gap-1">
                  <span>☀️ 早班 (07-19)</span>
                </div>
                <div class="truncate">${renderMemberPill(early)}</div>
              </div>
              <!-- 🌆 晚班 (淺灰色系) -->
              <div class="bg-slate-700/50 border border-slate-500/70 rounded-xl p-3 shadow-sm">
                <div class="text-xs text-slate-200 font-bold mb-1.5 flex items-center justify-center gap-1">
                  <span>🌆 晚班 (19-07)</span>
                </div>
                <div class="truncate">${renderMemberPill(late)}</div>
              </div>
            </div>

            ${support !== '-' || noteStr ? `
              <div class="text-xs bg-slate-950/60 px-3 py-2 rounded-xl flex items-center justify-between text-slate-300 border border-slate-800/60">
                ${support !== '-' ? `<span class="flex items-center gap-1.5"><b>機動:</b> ${renderMemberPill(support)}</span>` : '<span></span>'}
                ${noteStr ? `<span class="text-amber-200/90 font-medium">📝 ${noteStr}</span>` : ''}
              </div>
            ` : ''}
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    /* 📊 版型 B: 總覽大表格模式 (PC 寬螢幕 & 手機橫式最佳，早/晚雙班制) */
    function renderMatrixLayout(rows, columns) {
      const container = document.getElementById('scheduleContainer');
      if (!rows || rows.length === 0) {
        renderEmptyState(container);
        return;
      }

      let html = `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl matrix-table-container">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead>
              <tr class="bg-slate-950/90 text-slate-300 border-b border-slate-800 font-bold">
                <th class="p-3.5 sticky-col bg-slate-950 whitespace-nowrap">日期 / 哨點</th>
                <th class="p-3.5 whitespace-nowrap text-amber-300 bg-amber-950/20">☀️ 早班 (07-19 亮暖色)</th>
                <th class="p-3.5 whitespace-nowrap text-slate-200 bg-slate-800/40">🌆 晚班 (19-07 淺灰色)</th>
                <th class="p-3.5 whitespace-nowrap text-sky-400">機動支援</th>
                <th class="p-3.5 whitespace-nowrap text-slate-400">備註說明</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
      `;

      rows.forEach((r, idx) => {
        const bgRow = idx % 2 === 0 ? 'bg-slate-900/60' : 'bg-slate-900/20';
        html += `
          <tr class="${bgRow} hover:bg-slate-800/80 transition">
            <td class="p-3.5 sticky-col ${bgRow} font-bold text-white whitespace-nowrap">
              <div class="flex items-center gap-2">
                <span class="font-mono text-sm">${r['日期'] || '-'}</span>
                <span class="text-[10px] bg-sky-950 text-sky-300 px-1.5 py-0.5 rounded border border-sky-800">${r['星期'] || ''}</span>
                <span class="text-xs text-amber-300">${r['哨點/崗位'] || r['哨點'] || ''}</span>
              </div>
            </td>
            <td class="p-3.5 bg-amber-500/10 whitespace-nowrap">${renderMemberPill(r['早班 (07-19)'] || r['早班'] || '-')}</td>
            <td class="p-3.5 bg-slate-700/30 whitespace-nowrap">${renderMemberPill(r['晚班 (19-07)'] || r['晚班'] || '-')}</td>
            <td class="p-3.5 whitespace-nowrap">${renderMemberPill(r['機動支援'] || r['機動'] || '-')}</td>
            <td class="p-3.5 text-slate-400 text-xs whitespace-nowrap">${r['備註'] || '-'}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;
      container.innerHTML = html;
    }

    /* 👤 版型 C: 同仁個人勤務時間線 (個人查班專用，早/晚雙班制) */
    function renderTimelineLayout(rows, query) {
      const container = document.getElementById('scheduleContainer');
      if (!rows || rows.length === 0) {
        renderEmptyState(container);
        return;
      }

      let html = '<div class="space-y-3">';
      let totalDuties = rows.length;
      html += `
        <div class="bg-gradient-to-r from-purple-950/60 to-sky-950/60 border border-purple-800/60 p-4 rounded-2xl flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center font-bold text-lg">
              👤
            </div>
            <div>
              <div class="text-base font-bold text-white">${query ? '同仁勤務過濾：' + query : '全體勤務時間線'}</div>
              <div class="text-xs text-purple-300">共篩選出 ${totalDuties} 筆執勤排班</div>
            </div>
          </div>
        </div>
      `;

      rows.forEach(r => {
        const dateStr = r['日期'] || '未指定日期';
        const weekStr = r['星期'] || '';
        const postStr = r['哨點/崗位'] || r['哨點'] || r['崗位'] || '一般哨點';

        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-md">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-800 flex flex-col items-center justify-center font-mono">
                <span class="text-xs text-slate-400">${weekStr}</span>
                <span class="text-base font-bold text-white leading-none">${dateStr.split('/').pop() || ''}</span>
              </div>
              <div>
                <div class="text-sm font-bold text-white flex items-center gap-2">
                  <span>${dateStr}</span>
                  <span class="text-xs font-semibold text-amber-300 bg-amber-950/80 px-2 py-0.5 rounded border border-amber-800">${postStr}</span>
                </div>
                <div class="text-xs text-slate-400 mt-1">
                  備註：${r['備註'] || '正常執勤'}
                </div>
              </div>
            </div>

            <!-- Shifts pill: 僅 ☀️ 早班 vs 🌆 晚班 -->
            <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
              <div class="bg-amber-500/15 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                <span>☀️ 早班:</span> ${renderMemberPill(r['早班 (07-19)'] || r['早班'] || '-')}
              </div>
              <div class="bg-slate-700/50 border border-slate-500/70 text-slate-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                <span>🌆 晚班:</span> ${renderMemberPill(r['晚班 (19-07)'] || r['晚班'] || '-')}
              </div>
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function renderEmptyState(container) {
      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400 space-y-2">
          <i class="fa-regular fa-folder-open text-4xl text-slate-600"></i>
          <p class="text-base font-bold text-slate-300">查無符合條件的排班記錄</p>
          <p class="text-xs text-slate-500">可點選上方姓名按鈕或「全部」切換篩選條件</p>
        </div>
      `;
    }

    async function downloadCurrentPdf() {
      const btn = document.getElementById('downloadPdfBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>產生中...</span>`;
      btn.disabled = true;

      try {
        const res = await fetch(`/api/pdf/generate?group_id=${encodeURIComponent(groupId)}&tab=${encodeURIComponent(tabName)}`);
        const data = await res.json();
        if (data.download_url) {
          window.location.href = data.download_url;
        } else {
          alert('PDF 產生失敗，請稍後再試。');
        }
      } catch (e) {
        alert('連線失敗：' + e.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    openAuthModal();
  </script>
