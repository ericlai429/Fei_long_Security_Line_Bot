    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmailInput').value.trim();
      const pin = document.getElementById('adminMasterPinInput').value.trim();
      const confirmPin = document.getElementById('adminConfirmPinInput') ? document.getElementById('adminConfirmPinInput').value.trim() : '';
      const errDiv = document.getElementById('adminAuthError');
      const succDiv = document.getElementById('adminAuthSuccess');
      const linksDiv = document.getElementById('adminQuickLinks');
      const keyBtn = document.getElementById('secretAdminKeyBtn');

      if (errDiv) errDiv.style.display = 'none';
      if (succDiv) succDiv.style.display = 'none';

      if (!pin || pin.length < 3) {
        if (errDiv) {
          errDiv.textContent = '❌ PIN 碼長度至少需 3 位數！';
          errDiv.style.display = 'block';
        }
        return;
      }

      if (isSetupMode) {
        if (pin !== confirmPin) {
          if (errDiv) {
            errDiv.textContent = '❌ 兩次輸入的 PIN 碼不一致，請重新確認！';
            errDiv.style.display = 'block';
          }
          return;
        }

        localStorage.setItem('feilong_master_pin', pin);
        try {
          await fetch('/api/admin/master-pin/setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ admin_email: email, new_pin: pin })
          });
        } catch(ex) {}

        sessionMasterPin = pin;
        isUnlocked = true;

        if (succDiv) {
          succDiv.textContent = `👑 首次設定大成功！您的專屬 Master PIN 碼已永久記錄在後台。`;
          succDiv.style.display = 'block';
        }
        if (linksDiv) linksDiv.style.display = 'flex';

        if (keyBtn) {
          keyBtn.className = 'w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-950 border border-amber-500 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.4)] transition flex items-center justify-center active:scale-90 shrink-0';
          keyBtn.title = '👑 管理員已解鎖 (點擊可重開選單)';
        }

        setTimeout(() => {
          closeAdminAuthModal();
          fetchFullSchedule(true);
        }, 1500);
        return;
      }

      // 驗證登入
      const savedPin = localStorage.getItem('feilong_master_pin');
      let isValid = (savedPin && pin === savedPin);

      if (!isValid) {
        try {
          const res = await fetch('/api/admin/master-pin/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
          });
          if (res.ok) isValid = true;
        } catch(e) {}
      }

      if (isValid) {
        sessionMasterPin = pin;
        isUnlocked = true;
        
        if (succDiv) {
          succDiv.textContent = '👑 管理員驗證成功！已解鎖下月預排與後台權限。';
          succDiv.style.display = 'block';
        }
        if (linksDiv) linksDiv.style.display = 'flex';

        if (keyBtn) {
          keyBtn.className = 'w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-950 border border-amber-500 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.4)] transition flex items-center justify-center active:scale-90 shrink-0';
          keyBtn.title = '👑 管理員已解鎖 (點擊可重開選單)';
        }

        setTimeout(() => {
          closeAdminAuthModal();
          fetchFullSchedule(true);
        }, 1200);
      } else {
        if (errDiv) {
          errDiv.textContent = '❌ PIN 碼不正確，請輸入您設定的專屬 Master PIN 碼！';
          errDiv.style.display = 'block';
        }
      }
    }

    // 🔤 人員名稱格式化：100% 水平垂直居中、固定寬高與均勻字距，徹底杜絕歪斜
    // 🔒 資安防護：前天及更早之排班，電話不浮窗顯示 (Admin 登入解鎖者無此限制)
            function formatName(nameStr, isHistorical = false, hidePhone = false) {
      if (!nameStr || nameStr === '-' || nameStr === '—') return '<span class="inline-block text-slate-600 font-bold text-sm">—</span>';
      
      const items = nameStr.split(/[、,]+/).filter(Boolean);
      return items.map(item => {
        item = item.trim();
        const phoneMatch = item.match(/09\d{2}[-\s]?\d{3}[-\s]?\d{3}|\d{9,10}/);
        const phone = phoneMatch ? phoneMatch[0] : '';
        const cleanName = item.replace(/[\(（]?09\d{2}[-\s]?\d{3}[-\s]?[0-9]{3}[\)）]?|\d{8,10}|[\(（]\d+[\)]?/g, '').trim();
        
        if (!cleanName) return item;

        // 🌟 核心：固定寬度（96px / sm: 108px）、左側統一內縮 pl-3、文字絕對向左對齊 (text-left)，確保第一字左緣一線垂直到底！
        if (isHistorical || (hidePhone && !isUnlocked)) {
          return `<div class="inline-flex relative items-center justify-start w-[96px] sm:w-[108px] h-7 sm:h-8 pl-3 pr-2 rounded-lg bg-slate-800/50 text-slate-200 text-[15px] sm:text-[16px] font-black tracking-wider text-left whitespace-nowrap shadow-sm"><span class="text-left">${cleanName}</span></div>`;
        }

        if (phone) {
          const telHref = `tel:${phone.replace(/[-\s]/g, '')}`;
          return `
            <div class="relative group inline-flex items-center justify-center whitespace-nowrap">
              <button type="button" class="inline-flex relative items-center justify-start w-[96px] sm:w-[108px] h-7 sm:h-8 pl-3 pr-2 rounded-lg bg-slate-800/95 border border-slate-700 hover:border-amber-400 hover:bg-slate-700 text-white text-[15px] sm:text-[16px] font-black tracking-wider text-left transition shadow-sm active:scale-95 whitespace-nowrap">
                <span class="text-left">${cleanName}</span>
                <i class="fa-solid fa-phone text-[8px] text-amber-400 opacity-90 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </button>
              <div class="invisible group-hover:visible group-focus-within:visible opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-all duration-200 absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-50 px-3 py-1.5 bg-slate-950 border border-amber-500 text-amber-300 text-xs font-mono rounded-xl shadow-2xl whitespace-nowrap flex items-center gap-2 pointer-events-auto">
                <i class="fa-solid fa-phone-volume text-emerald-400 animate-pulse"></i>
                <a href="${telHref}" class="font-bold underline hover:text-white">${phone}</a>
                <span class="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">(撥打)</span>
              </div>
            </div>
          `;
        }

        return `<div class="inline-flex relative items-center justify-start w-[96px] sm:w-[108px] h-7 sm:h-8 pl-3 pr-2 rounded-lg bg-slate-800/80 text-white text-[15px] sm:text-[16px] font-black tracking-wider text-left whitespace-nowrap shadow-sm"><span class="text-left">${cleanName}</span></div>`;
      }).join(' ');
    }

      const isEng = (currentTabName.includes('4.') || currentTabName.includes('工務所'));

      if (selectedYear === REAL_CURRENT_YEAR && selectedMonth === 8) {

      if (selectedYear === REAL_CURRENT_YEAR && selectedMonth === 7) {

          <div class="text-center py-12 space-y-4">

      setConnectionStatus('connecting', '雲端握手中...');

      // 🌟 2. 本地開發環境 (localhost / 127.0.0.1) 直連本地後端
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 1200);
          const apiRes = await fetch(`/api/schedule/live?group_id=${encodeURIComponent(currentGroupId)}&tab=${encodeURIComponent(currentTabName)}&year=${selectedYear}&month=${selectedMonth}&t=${new Date().getTime()}`, {
            signal: controller.signal,
            cache: 'no-store'
          });
          clearTimeout(timeoutId);
          if (apiRes.ok) {

      // 🌟 3. 備用快照直連通道
      const snapUrls = [
        isEng ? './data/schedule_4_tsgh_eng.json' : './data/schedule_5_tsgh_icu.json',
        isEng ? 'https://raw.githubusercontent.com/ericlai429/Fei_long_Security_Line_Bot/main/docs/data/schedule_4_tsgh_eng.json' : 'https://raw.githubusercontent.com/ericlai429/Fei_long_Security_Line_Bot/main/docs/data/schedule_5_tsgh_icu.json'
      ];

      for (const url of snapUrls) {
        try {

    function renderFullScheduleTable(data) {

        if (selectedMonth === 9 || (selectedYear === 2026 && selectedMonth > 8)) {
          container.innerHTML = `
            <div class="text-center py-12 space-y-4">

      const now = new Date();
      const todayShort = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

          // 🔥 今天的日期：底色 High Light 暖色系琥珀金光，日期保持與其他列完全相同的等寬版型
          rowClass = 'bg-gradient-to-r from-amber-500/25 via-amber-500/35 to-amber-500/25 border-y-2 border-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.3)] ring-1 ring-amber-400/60 font-black';
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center py-0.5 rounded-md bg-amber-500 text-slate-950 font-black text-xs sm:text-sm font-mono shadow-md">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded-md bg-amber-500 text-slate-950 font-black text-[11px] shadow-md">${weekStr}</span>`;
        } else if (weekStr === '六' || weekStr === 'Sat' || weekStr.includes('六')) {
          weekBadgeClass = 'bg-teal-950 text-teal-300 border-teal-500 font-black shadow-sm';
          rowClass = 'bg-teal-950/25 hover:bg-teal-900/40 border-b border-slate-800/80';
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center font-mono font-extrabold text-teal-200">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;
        } else if (weekStr === '日' || weekStr === 'Sun' || weekStr.includes('日')) {
          weekBadgeClass = 'bg-rose-950 text-rose-300 border-rose-500 font-black shadow-sm';
          rowClass = 'bg-rose-950/25 hover:bg-rose-900/40 border-b border-slate-800/80';
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center font-mono font-extrabold text-rose-200">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;
        } else {
          dateDisplayHtml = `<span class="inline-block w-12 sm:w-14 text-center font-mono font-extrabold text-slate-100">${dateStr}</span>`;
          weekDisplayHtml = `<span class="inline-block w-6 sm:w-7 h-5 sm:h-6 leading-5 sm:leading-6 text-center rounded text-[11px] font-bold border ${weekBadgeClass}">${weekStr}</span>`;
        }

        const isHistorical = !(selectedYear === REAL_CURRENT_YEAR && selectedMonth === REAL_CURRENT_MONTH);

        // 🔒 前天與更早之排班判定 (今天 = now.getDate(), 昨天 = now.getDate() - 1, 前天 = now.getDate() - 2)
        let rowDayNum = 0;
        if (dateStr.includes('/')) {
          const parts = dateStr.split('/');
          rowDayNum = parseInt(parts[parts.length - 1], 10) || 0;
        }
        // 若當前月份且日期 <= 今天 - 2 (前天或更早)，啟動電話隱藏保護
        const isBeforeYesterday = (selectedYear === now.getFullYear() && selectedMonth === (now.getMonth() + 1)) && (rowDayNum > 0 && rowDayNum <= (now.getDate() - 2));

        html += `
          <tr class="${rowClass} transition">
            <td class="w-[17%] py-2.5 px-1 whitespace-nowrap text-center text-xs sm:text-sm">${dateDisplayHtml}</td>
            <td class="w-[11%] py-2.5 px-0.5 whitespace-nowrap text-center">${weekDisplayHtml}</td>
            <td class="w-[36%] py-1.5 px-0.5 whitespace-nowrap text-center align-middle font-medium">${formatName(early, isHistorical, isBeforeYesterday)}</td>
            <td class="w-[36%] py-1.5 px-0.5 whitespace-nowrap text-center align-middle font-medium">${formatName(late, isHistorical, isBeforeYesterday)}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }



    document.addEventListener('DOMContentLoaded', () => {
      updateMonthDisplay();
      fetchFullSchedule();
    });
  </script>
</body>
</html>
