<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>飛龍保全 ｜ 三總勤務全哨人員排班總表 (PDF 直出)</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#090d16">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .print-table { border-collapse: collapse !important; width: 100% !important; font-size: 11pt !important; }
      .print-table th, .print-table td { border: 1px solid #333 !important; padding: 6px 8px !important; color: black !important; }
      .print-table th { background-color: #f0f0f0 !important; font-weight: bold !important; }
      .print-header { display: block !important; }
    }
    .print-header { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased select-none">

  <!-- 🔒 Double PIN Authentication Modal -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl">
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-purple-600/20 border border-purple-500/40 text-purple-400 flex items-center justify-center mx-auto text-xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-base font-bold text-white">三總全哨排班安全驗證</h2>
        <p class="text-xs text-slate-400">請輸入雙 PIN 碼解鎖全哨排班 PDF</p>
      </div>

      <form id="pinAuthForm" onsubmit="handlePinUnlock(event)" class="space-y-4">
        <div>
          <label class="block text-slate-300 text-xs font-bold mb-1">主 PIN 碼 (3位數)</label>
          <input 
            type="password" 
            id="inputMasterPin" 
            inputmode="numeric"
            maxlength="3"
            value="789"
            required 
            placeholder="請輸入主 PIN 碼" 
            class="w-full h-11 bg-slate-950 border border-slate-700 rounded-xl px-3 text-base font-mono tracking-widest text-white text-center font-bold focus:outline-none focus:border-purple-500"
          >
        </div>

        <div>
          <label class="block text-slate-300 text-xs font-bold mb-1 flex items-center justify-between">
            <span>小隊 輔 PIN 碼 (3~4位數)</span>
            <span class="text-xs text-sky-400">輔助Pin碼_請詢問分組隊長</span>
          </label>
          <input 
            type="password" 
            id="inputSubPin" 
            inputmode="numeric"
            maxlength="4"
            value="8888"
            required 
            placeholder="請輸入輔助Pin碼 (請詢問分組隊長)" 
            class="w-full h-11 bg-slate-950 border border-slate-700 rounded-xl px-3 text-base font-mono tracking-widest text-white text-center font-bold focus:outline-none focus:border-sky-500"
          >
        </div>

        <div id="authErrorMsg" class="hidden text-xs text-rose-400 bg-rose-950/80 border border-rose-800 p-2.5 rounded-xl text-center font-bold"></div>

        <button 
          type="submit" 
          class="w-full h-12 bg-gradient-to-r from-purple-600 to-sky-600 hover:from-purple-500 hover:to-sky-500 active:scale-[0.98] text-white font-bold rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-lock-open"></i>
          <span>解鎖查看全哨排班</span>
        </button>
      </form>
    </div>
  </div>

  <!-- 📋 Paste Schedule Modal -->
  <div id="pasteScheduleModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-purple-800 rounded-3xl max-w-lg w-full p-5 sm:p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2 text-white font-bold text-base">
          <i class="fa-solid fa-clipboard-list text-purple-400"></i>
          <span>貼上試算表內容 (更新全哨排班)</span>
        </div>
        <button onclick="closePasteModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <textarea 
        id="pasteDataTextarea" 
        rows="8" 
        placeholder="在 Google 試算表中按 Ctrl+A ➔ Ctrl+C 複製，並在此處按 Ctrl+V 貼上..."
        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 font-mono focus:outline-none focus:border-purple-500 placeholder-slate-600 resize-none"
      ></textarea>

      <div class="flex gap-2">
        <button onclick="closePasteModal()" class="flex-1 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition">
          取消
        </button>
        <button onclick="handleApplyPastedSchedule()" class="flex-1 h-10 bg-gradient-to-r from-purple-600 to-sky-600 hover:from-purple-500 hover:to-sky-500 text-white text-xs font-bold rounded-xl transition shadow-lg">
          確認更新並產製
        </button>
      </div>
    </div>
  </div>

  <!-- 🖨️ Printable Header for Official PDF -->
  <div class="print-header p-4 text-center border-b-2 border-black mb-4">
    <h1 class="text-2xl font-bold">飛龍保全股份有限公司 ｜ 三軍總醫院勤務排班總表</h1>
    <p class="text-sm mt-1">分頁名稱：<span id="printTabName">三總保全內部群</span> ｜ 匯出時間：<span id="printTime"></span></p>
  </div>

  <!-- Main Pure View (No Fluff, Direct PDF Output) -->
  <header class="no-print bg-slate-900/90 border-b border-slate-800 p-3 sm:p-4 sticky top-0 z-20 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold">
          <i class="fa-solid fa-shield-halved text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-bold text-white leading-tight">飛龍保全 ｜ 三總全哨排班總表</h1>
          <p class="text-[11px] text-purple-300" id="currentTabLabel">全哨人員對應 PDF 直出</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button 
          onclick="openPasteModal()" 
          class="h-9 px-3 bg-slate-800 hover:bg-slate-700 text-purple-300 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1.5"
          title="貼上試算表更新排班"
        >
          <i class="fa-solid fa-paste"></i>
          <span class="hidden sm:inline">貼上資料</span>
        </button>
        <button 
          onclick="downloadOrPrintPdf()" 
          id="directPdfBtn"
          class="h-9 sm:h-10 px-4 sm:px-5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs sm:text-sm font-bold rounded-xl shadow-lg transition flex items-center gap-2 active:scale-95"
        >
          <i class="fa-solid fa-file-pdf text-sm"></i>
          <span>一鍵輸出 / 下載全哨 PDF</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 space-y-4">
    
    <!-- 📄 Full Detachment Personnel Schedule Table (Print Ready) -->
    <div id="scheduleContainer" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
      <div class="text-center py-16 text-slate-400 space-y-3">
        <div class="w-10 h-10 border-3 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-bold">載入全哨排班資料中...</p>
      </div>
    </div>

  </main>

  <footer class="no-print text-center py-4 text-xs text-slate-600 border-t border-slate-900 mt-auto">
    飛龍保全 ｜ 三軍總醫院保全勤務 ｜ 支援一鍵直出繁體中文 PDF 報表
  </footer>

  <script>
    let rawScheduleData = null;
    let isUnlocked = false;
    let sessionMasterPin = '789';
    let sessionSubPin = '8888';

    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('group_id') || 'tsgh_internal';
    const tabName = urlParams.get('tab') || '三總保全內部群';

    function openAuthModal() {
      document.getElementById('authModal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    function openPasteModal() {
      document.getElementById('pasteScheduleModal').classList.remove('hidden');
      document.getElementById('pasteDataTextarea').focus();
    }

    function closePasteModal() {
      document.getElementById('pasteScheduleModal').classList.add('hidden');
    }

    function handlePinUnlock(e) {
      e.preventDefault();
      const masterPin = document.getElementById('inputMasterPin').value.trim();
      const subPin = document.getElementById('inputSubPin').value.trim();
      const errorDiv = document.getElementById('authErrorMsg');

      errorDiv.classList.add('hidden');

      if (masterPin === '789' && (subPin === '8888' || subPin.length >= 3)) {
        sessionMasterPin = masterPin;
        sessionSubPin = subPin;
        isUnlocked = true;
        closeAuthModal();
        fetchFullSchedule();
      } else {
        errorDiv.textContent = '❌ PIN 碼錯誤 (預設主PIN: 789, 輔PIN請洽分組隊長)';
        errorDiv.classList.remove('hidden');
      }
    }

    // 🔤 生僻字模糊輔助
    function formatName(name) {
      if (!name || name === '-') return '-';
      const trimmed = name.trim();
      if (trimmed.length <= 1) return `<b>${trimmed}</b>`;
      return `<span class="text-base font-extrabold">${trimmed.charAt(0)}</span><span class="font-semibold">${trimmed.slice(1)}</span>`;
    }

    function parseUniversalScheduleText(text, tab) {
      const lines = text.split(/\\r?\\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return null;
      
      const delimiter = lines[0].includes('\\t') ? '\\t' : ',';
      const headers = lines[0].split(delimiter).map(h => h.trim().replace(/^"|"$/g, ''));
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(delimiter).map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols.length <= 1 && !cols[0]) continue;
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = cols[idx] || '';
        });
        rows.push(row);
      }

      return {
        tab_name: tab || '三總保全內部群',
        columns: headers,
        rows: rows
      };
    }

    function handleApplyPastedSchedule() {
      const text = document.getElementById('pasteDataTextarea').value.trim();
      if (!text) {
        alert('請先貼上排班表格內容！');
        return;
      }

      const parsed = parseUniversalScheduleText(text, tabName);
      if (!parsed || parsed.rows.length === 0) {
        alert('無法解析排班表內容，請確認是否包含表頭與排班列。');
        return;
      }

      localStorage.setItem('feilong_custom_schedule', JSON.stringify(parsed));
      rawScheduleData = parsed;
      closePasteModal();
      renderFullScheduleTable(parsed);
    }

    async function fetchFullSchedule() {
      const container = document.getElementById('scheduleContainer');

      // 🌟 0. 優先讀取 Admin (ericlai429@gmail.com) keep loaded 的即時雲端試算表
      try {
        const endpoints = ['/api/schedule/live', 'http://127.0.0.1:8088/api/schedule/live'];
        for (const ep of endpoints) {
          try {
            const apiRes = await fetch(`${ep}?group_id=${encodeURIComponent(groupId)}&tab=${encodeURIComponent(tabName)}&master_pin=789&sub_pin=8888&t=${new Date().getTime()}`, {
              cache: 'no-store'
            });
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData.rows && apiData.rows.length > 0) {
                rawScheduleData = apiData;
                renderFullScheduleTable(rawScheduleData);
                return;
              }
            }
          } catch(err) {}
        }
      } catch(e) {}

      // 1. Check local storage
      const savedCustom = localStorage.getItem('feilong_custom_schedule');
      if (savedCustom) {
        try {
          rawScheduleData = JSON.parse(savedCustom);
          renderFullScheduleTable(rawScheduleData);
          return;
        } catch(e) {}
      }

      // 2. Try Google Sheet Direct
      const sheetId = '1HTZPjBilY4f584mO7s37IuoPlq-syvKFeaghxXlAO-s';
      const gid = '1503884715';
      try {
        const csvRes = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`);
        if (csvRes.ok) {
          const csvText = await csvRes.text();
          if (!csvText.includes('<!DOCTYPE') && !csvText.includes('<html')) {
            rawScheduleData = parseUniversalScheduleText(csvText, tabName);
            renderFullScheduleTable(rawScheduleData);
            return;
          }
        }
      } catch(e) {}

      // 3. Fallback: Prompt user to paste schedule table directly
      container.innerHTML = `
        <div class="text-center py-10 space-y-4">
          <div class="w-14 h-14 rounded-2xl bg-amber-950/80 border border-amber-800 text-amber-400 flex items-center justify-center mx-auto text-2xl">
            <i class="fa-solid fa-file-circle-plus"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">點擊下方按鈕貼上排班表</h2>
            <p class="text-xs text-slate-400 mt-1">從 Google 試算表全選複製 (Ctrl+A ➔ Ctrl+C)，貼上即可 1 秒直出全哨排班 PDF！</p>
          </div>
          <button onclick="openPasteModal()" class="h-11 px-6 bg-gradient-to-r from-purple-600 to-sky-600 hover:from-purple-500 hover:to-sky-500 text-white font-bold rounded-xl text-xs sm:text-sm shadow-lg transition">
            📋 貼上排班表 (即刻輸出 PDF)
          </button>
        </div>
      `;
    }

    function renderFullScheduleTable(data) {
      const container = document.getElementById('scheduleContainer');
      if (!data || !data.rows || data.rows.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-500">尚無排班資料</div>';
        return;
      }

      document.getElementById('printTabName').textContent = data.tab_name || tabName;
      document.getElementById('printTime').textContent = new Date().toLocaleString();

      let html = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 no-print">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-table-list text-emerald-400"></i>
            <span class="text-sm font-bold text-white">全哨人員勤務清單 (共 ${data.rows.length} 列勤務)</span>
          </div>
          <button onclick="downloadOrPrintPdf()" class="text-xs text-emerald-400 hover:underline font-bold flex items-center gap-1">
            <i class="fa-solid fa-print"></i>直接列印/存為PDF
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse print-table">
            <thead>
              <tr class="bg-slate-950 text-slate-300 border-b border-slate-800 font-bold">
                <th class="p-2.5 whitespace-nowrap">日期</th>
                <th class="p-2.5 whitespace-nowrap">星期</th>
                <th class="p-2.5 whitespace-nowrap text-amber-300">哨點/崗位</th>
                <th class="p-2.5 whitespace-nowrap text-amber-400">☀️ 早班 (07-19)</th>
                <th class="p-2.5 whitespace-nowrap text-slate-300">🌆 晚班 (19-07)</th>
                <th class="p-2.5 whitespace-nowrap text-sky-400">機動支援</th>
                <th class="p-2.5 whitespace-nowrap text-slate-400">備註</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
      `;

      data.rows.forEach(r => {
        const dateStr = r['日期'] || '-';
        const weekStr = r['星期'] || '';
        const postStr = r['哨點/崗位'] || r['哨點'] || r['崗位'] || '-';
        const early = r['早班 (07-19)'] || r['早班'] || '-';
        const late = r['晚班 (19-07)'] || r['晚班'] || '-';
        const support = r['機動支援'] || r['機動'] || '-';
        const note = r['備註'] || '';

        html += `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-2.5 font-mono font-bold text-white whitespace-nowrap">${dateStr}</td>
            <td class="p-2.5 whitespace-nowrap"><span class="bg-sky-950 text-sky-300 px-1.5 py-0.5 rounded text-[11px] font-bold border border-sky-800">${weekStr}</span></td>
            <td class="p-2.5 font-bold text-amber-300 whitespace-nowrap">${postStr}</td>
            <td class="p-2.5 text-amber-200 whitespace-nowrap font-medium">${formatName(early)}</td>
            <td class="p-2.5 text-slate-200 whitespace-nowrap font-medium">${formatName(late)}</td>
            <td class="p-2.5 text-sky-300 whitespace-nowrap font-medium">${formatName(support)}</td>
            <td class="p-2.5 text-slate-400 text-[11px]">${note}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    function downloadOrPrintPdf() {
      window.print();
    }

    // Auto unlock on load if default PIN
    document.addEventListener('DOMContentLoaded', () => {
      fetchFullSchedule();
    });
  </script>
</body>
</html>
